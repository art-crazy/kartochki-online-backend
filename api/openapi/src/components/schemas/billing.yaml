schemas:
  BillingUsage:
    type: object
    required:
      - value
      - max
    properties:
      value:
        type: integer
        example: 87
      max:
        type: integer
        example: 500

  BillingPlanFeature:
    type: object
    required:
      - label
      - enabled
    properties:
      label:
        type: string
        example: Все стили генерации
      enabled:
        type: boolean
        example: true

  BillingPlan:
    type: object
    required:
      - id
      - name
      - monthly_price
      - cards_per_month
      - features
    properties:
      id:
        type: string
        example: pro
      name:
        type: string
        example: Профи
      monthly_price:
        type: integer
        example: 1490
      yearly_monthly_price:
        type: integer
        example: 990
      cards_per_month:
        type: integer
        example: 500
      features:
        type: array
        items:
          $ref: "#/schemas/BillingPlanFeature"
      current:
        type: boolean
      popular:
        type: boolean

  BillingAddon:
    type: object
    required:
      - id
      - title
      - description
      - price
    properties:
      id:
        type: string
        example: cards_100
      title:
        type: string
        example: 100 карточек
      description:
        type: string
        example: Разовый пакет для срочного объёма.
      price:
        type: integer
        example: 490

  BillingCard:
    type: object
    required:
      - last4
      - card_type
      - expiry_month
      - expiry_year
    properties:
      last4:
        type: string
        example: "4242"
      card_type:
        type: string
        example: Visa
      expiry_month:
        type: string
        example: "12"
      expiry_year:
        type: string
        example: "2027"

  BillingPaymentMethod:
    type: object
    required:
      - type
      - card
    properties:
      type:
        type: string
        example: bank_card
      card:
        $ref: "#/schemas/BillingCard"

  BillingSubscription:
    type: object
    required:
      - plan_id
      - plan_name
      - has_payment_method
      - usage
    properties:
      plan_id:
        type: string
        example: pro
      plan_name:
        type: string
        example: Профи
      renews_at:
        type: string
        format: date-time
      cancels_at:
        type: string
        format: date-time
      has_payment_method:
        type: boolean
        example: true
      payment_method:
        $ref: "#/schemas/BillingPaymentMethod"
      usage:
        $ref: "#/schemas/BillingUsage"

  DeletePaymentMethodResponse:
    type: object
    required:
      - has_payment_method
    properties:
      has_payment_method:
        type: boolean
        example: false

  BillingResponse:
    type: object
    required:
      - current_subscription
      - plans
      - addons
      - checkout_requirements
    properties:
      current_subscription:
        $ref: "#/schemas/BillingSubscription"
      plans:
        type: array
        items:
          $ref: "#/schemas/BillingPlan"
      addons:
        type: array
        items:
          $ref: "#/schemas/BillingAddon"
      checkout_requirements:
        $ref: "#/schemas/BillingCheckoutRequirements"

  BillingCheckoutRequirements:
    type: object
    required:
      - email_required
    properties:
      email_required:
        type: boolean
        description: Нужно ли запросить email перед созданием checkout.
        example: true

  CreateCheckoutRequest:
    type: object
    required:
      - plan_id
      - period
    properties:
      plan_id:
        type: string
        example: pro
      period:
        type: string
        enum:
          - monthly
          - yearly
        example: monthly
      customer_email:
        type: string
        format: email
        description: Email для чека ЮКасса, если в профиле пользователя email отсутствует.
        example: ivan@example.com

  CreateCheckoutResponse:
    type: object
    required:
      - checkout_url
    properties:
      checkout_url:
        type: string
        format: uri
        example: https://pay.example.com/checkout/session-123

  PurchaseAddonRequest:
    type: object
    required:
      - addon_id
    properties:
      addon_id:
        type: string
        example: cards_100
      customer_email:
        type: string
        format: email
        description: Email для чека ЮКасса, если в профиле пользователя email отсутствует.
        example: ivan@example.com

  PurchaseAddonResponse:
    type: object
    required:
      - checkout_url
    properties:
      checkout_url:
        type: string
        format: uri
        example: https://pay.example.com/checkout/session-456

  CancelSubscriptionResponse:
    type: object
    required:
      - status
    properties:
      status:
        type: string
        enum:
          - scheduled_cancel
        example: scheduled_cancel
